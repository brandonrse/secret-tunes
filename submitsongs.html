<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="./submitsongs.css" />
  <link rel="stylesheet" href="./navbar.css"/>
</head>

<body>
  <nav class="navbar">
    <a href="./index.html" class="navbar-brand">Secret Tunes</a>

    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="navbar-menu" id="navbarMenu">
      <a href="./index.html">Home</a>
      <a href="./songs.html">Song Library</a>
      <a href="./jeopardy.html">Jeopardy Mode</a>
      <a href="./score.html">Score Attack</a>
      <a href="./adventure.html">Adventure Mode</a>
      <a href="./battle.html">Battle Mode</a>
    </div>
  </nav>
  <div class="container my-5">
    <div class="card bg-panel text-text shadow-sm p-4">
      <h1 class="text-center mb-4">Submit a Song</h1>
      <form id="songForm" class="compact-form">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Song Title:</label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Game:</label>
            <input type="text" name="game" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">YouTube URL:</label>
            <input type="url" name="youtube" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Hints:</label>
            <input type="text" name="hints" class="form-control" required>
          </div>
        </div>

        <fieldset class="mb-3 p-3 border rounded">
          <legend class="form-label">Difficulty</legend>
          <div id="difficultyFieldset" class="d-flex flex-wrap gap-3">
            <div class="form-check"> <input type="radio" name="difficulty" value="Easy" class="form-check-input"
                required> <label class="form-check-label">Easy</label> </div>
            <div class="form-check"> <input type="radio" name="difficulty" value="Normal" class="form-check-input">
              <label class="form-check-label">Normal</label> </div>
            <div class="form-check"> <input type="radio" name="difficulty" value="Tough" class="form-check-input">
              <label class="form-check-label">Tough</label> </div>
            <div class="form-check"> <input type="radio" name="difficulty" value="Lunatic" class="form-check-input">
              <label class="form-check-label">Lunatic</label> </div>
            <div class="form-check"> <input type="radio" name="difficulty" value="Merciless" class="form-check-input">
              <label class="form-check-label">Merciless</label> </div>
          </div>
        </fieldset>

        <fieldset class="mb-3 p-3 border rounded">
          <legend class="form-label">Categories</legend>
          <div id="categoriesFieldset" class="chip-grid"></div>
        </fieldset>

        <fieldset class="mb-3 p-3 border rounded">
          <legend class="form-label">Series</legend>
          <div id="seriesFieldset" class="chip-grid"></div>
        </fieldset>

        <div class="text-center">
          <button type="submit" class="btn btn-success btn-lg" id="submitBtn">
            <span id="btnText">Submit</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2" role="status" style="display:none;"></span>
          </button>
        </div>

      </form>
    </div>
  </div>



  <script src="./scripts/submit.js" type="module" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
    <script src="./scripts/navbar.js"></script>
</body>

</html>
