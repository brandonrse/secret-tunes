<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score Attack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="score.css"/>
</head>
<body>
  <nav class="navbar">
    <a href="./index.html" class="navbar-brand">Secret Tunes</a>
    <div class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </div>
    <div class="navbar-menu" id="navbarMenu">
      <a href="./songs.html">Song Library</a>
      <a href="./jeopardy.html">Jeopardy Mode</a>
      <a href="./score.html" class="active">Score Attack</a>
      <a href="./adventure.html">Adventure Mode</a>
    </div>
  </nav>   

  <div class="container song-container">

    <div class="scoreboard">
  <div class="high-score">High Score: 0</div>
  <div class="score-text">Score: 0</div>
  <div class="hints-used">Hints Used: 0</div>
  <div class="hearts">❤️ ❤️ ❤️</div>
</div>

    <!-- Song Info -->
    <div class="song-info text-center">
      <h1 class="result"></h1>
      <h1 class="song-title">???</h1>
      <h2 class="song-game">?????</h2>
    </div>

    <!-- Player Controls -->
    <div id="player"></div>
    <div id="custom-controls">
      <div class="circle"><span id="play" class="material-icons">play_circle</span></div>
      <div class="circle"><span id="pause" class="material-icons">pause_circle</span></div>
      <input type="range" id="volume-slider" min="0" max="100" value="20">
    </div>

    <!-- Guess Form -->
    <div class="form streak-form card p-3 mt-4">
      <input class="form-control mb-2" list="songDataListOptions" id="songDataList" placeholder="Type to search a song...">
      <datalist id="songDataListOptions"></datalist>
      <button class="btn btn-success streak-btn mb-2" type="button">Submit</button>
      <button class="btn btn-warning hint-btn d-none">Reveal Hint</button>
      <div class="hint-div d-none mt-2 p-2"></div>
    </div>

    <!-- Timer -->
    <div id="timer" class="text-center mt-3"></div>
  </div>

  <script src="./scripts/playerUtility.js" type="module"></script>
  <script src="./scripts/streak.js" type="module"></script>
</body>

</html>
