<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeopardy Mode</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
  <link rel="stylesheet" href="jeopardy.css"/>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="#">Secret Tunes</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item active">
          <a class="nav-link" href="./index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="./jeopardy.html">Jeopardy Mode <span class="sr-only">(current)</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="./score.html">Score Attack</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="./adventure.html">Adventure Mode</a>
        </li>
      </ul>
    </div>
  </nav>
  <div class="container-sm settings">
    <!-- <input type="file" id="songsCsv" accept=".csv" />
    <pre id="output"></pre> -->
    <div class="player-count-div">
      <label class="form-label" for="playerCount">Player Count</label>
      <input type="number" id="playerCount" class="form-control" min="1" max="8" value="0" />

      <div class="player-select-div">
        <input type="text" class="form-control player-name player-name1" id="playerName playerName1" placeholder="Player 1">
      </div>
    </div>
    <div class="category-select-div">
    </div>
    <br />
    <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#collapse" aria-expanded="false" aria-controls="collapse">
    Expand Series' Filters
    </button>
    <div class="collapse" id="collapse">
      <div class="series-check-div"></div>
    </div>
    <button class="btn btn-success new-board-btn">New Board</button>
  </div> 

  <div class="container game-container fade-in"></div>

    <!-- <div id="questionScreen" class="container question-container d-none"> -->
    <div id="questionScreen" class="container question-container fade-in">
      <div id="category-difficulty"></div>
      <div id="song-title">
        <p id="span-name">???</span>
        <p id="span-game"></span>
      </div>
      <div id="hint-div" class="d-none">
        This is a test hint
      </div>
      <div id=player-gif>
        <div id="players-div">
        </div>
        <!-- <div id="gif-div">
          <img src="./fridaynight.gif" style="width: 500px;">
        </div> -->
      </div>
      <div id="player"></div>
      <div id="custom-controls">
        <div class="circle">
          <span id="play" class="material-icons">play_circle</span>
        </div>
        <div class="circle">
          <span id="pause" class="material-icons">pause_circle</button>
        </div>
        <input type="range" id="volume-slider" min="0" max="100" value="20">
      </div>
      <div id="ad-warning"></div>

      <div class="game-buttons">
        <button id="reveal-hint" class="btn btn-warning">Reveal Hint</button>
        <button id="reroll" class="btn btn-primary">Reroll Song</button>
        <button id="revealSong" class="btn btn-success">Reveal Song</button>
        <button id="backToBoard" class="btn btn-dark">Back to Board</button>
      </div>
    </div>
  <br /><br />

  <script src="./scripts/jeopardy.js" type="module" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
